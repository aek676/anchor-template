name: CI

on:
  push:
  pull_request:
  # Weekly run catches upstream breakage (Anchor, Agave, LiteSVM) before you hit it locally.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  # Keep in sync with [toolchain] in Anchor.toml. Rust comes from rust-toolchain.toml.
  ANCHOR_VERSION: "1.2.1"
  SOLANA_VERSION: "4.1.2"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # Prebuilt binary from the Anchor release: seconds instead of compiling avm (~2 min).
      # avm isn't needed here, the versions are already the ones pinned in Anchor.toml.
      - name: Install Anchor CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/otter-sec/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/anchor" --version

      - name: Create a throwaway wallet
        run: solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json

      # Only in the template repo (generated projects don't get cargo-generate.toml): the raw
      # template has {{placeholders}}, so generate a project from it and test that instead.
      - name: Install cargo-generate
        if: hashFiles('cargo-generate.toml') != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate

      - name: Generate a project from the template
        if: hashFiles('cargo-generate.toml') != ''
        run: |
          cargo generate --path . --name ci-check --destination . --silent --allow-commands
          echo "PROJECT_DIR=ci-check" >> "$GITHUB_ENV"

      # After generation so it can point at the project that is actually built.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.PROJECT_DIR || '.' }} -> target

      - name: Build and test
        working-directory: ${{ env.PROJECT_DIR || '.' }}
        env:
          NO_DNA: "1"
        run: anchor test
